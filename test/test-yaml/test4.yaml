config:
  protocol: "udp"
  family: "ipv4"
  ip_address: "127.0.0.1"
  port: "10000"

tests:
  - test:
      steps:
        - send: "Hello World"
          expect: "Yo!"
        - send: "Hello! How are you?"
          expect: "Hi. I am fine!"
        - send: "[in] gg"
          expect: "[out] gg"
        - send: "Good bye!"
          expect: "Bye!"
        - send: "ping"
          expect: "pong"
        - send: "echo test"
          expect: "echo test"
        - send: "status"
          expect: "ok"
        - send: "version"
          expect: "1.0"
        - send: "name"
          expect: "udp-test-server"
        - send: "help"
          expect: "commands: ping, status, version, name, help, quit"
        - send: "invalid command"
          expect: "error: unknown command"
        - send: ""
          expect: "error: empty message"
        - send: "12345"
          expect: "54321"
        - send: "UPPERCASE"
          expect: "uppercase"
        - send: "lowercase"
          expect: "LOWERCASE"
        - send: "spaces   inside"
          expect: "spaces   inside"
        - send: "special !@#$%^&*()"
          expect: "special !@#$%^&*()"
        - send: "json {\"msg\":\"hello\"}"
          expect: "json ok"
        - send: "long message abcdefghijklmnopqrstuvwxyz"
          expect: "long message received"
        - send: "quit"
          expect: "closing"

  - test:
      steps:
        - send: "Good bye!"
          expect: "Bye!"
        - send: "ping"
          expect: "pong"
        - send: "connect"
          expect: "connected"
        - send: "disconnect"
          expect: "disconnected"
        - send: "reconnect"
          expect: "reconnected"
        - send: "data one"
          expect: "received one"
        - send: "data two"
          expect: "received two"
        - send: "data three"
          expect: "received three"
        - send: "reset"
          expect: "reset ok"
        - send: "final"
          expect: "done"