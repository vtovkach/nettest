config:
  protocol: "tcp"
  family: "ipv6"
  ip_address: "::2"
  port: "5678"

tests:
  - name: "multiple step conversation"
    steps:
      - send: "connect"
        expect: "connected"

      - send: "login user"
        expect: "login ok"

      - send: "quit"
        expect: "disconnected"

  - name: "second session"
    steps:
      - send: "health"
        expect: "healthy"