config:
  protocol: "tcp"
  family: "ipv6"
  ip_address: "::2"
  port: "5678"

tests:
  - test:
      steps:
        - send: "connect"
          expect: "connected"

        - send: "login user"
          expect: "login ok"

        - send: "quit"
          expect: "disconnected"

  - test:
      steps:
        - send: "health"
          expect: "healthy"