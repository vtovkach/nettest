config:
  protocol: "tcp"
  family: "ipv4"
  ip_address: "127.0.0.1"
  port: "10001"

tests:
  - name: "echo short messages"
    steps:
      - send: "ping"
        expect: "pong"

      - send: "test"
        expect: "ok"

  - name: "close message"
    steps:
      - send: "bye"
        expect: "goodbye"