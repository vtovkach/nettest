config:
  protocol: "udp"
  family: "ipv4"
  ip_address: "127.0.0.1"
  port: "10000"

tests:
  - test:
      steps:
        - send: "Hello World"
          expect: "Yo!"
        - send: "Hello! How are you?"
          expect: "Hi. I am fine!"

  - test:
      steps:
        - send: "Good bye!"
          expect: "Bye!"